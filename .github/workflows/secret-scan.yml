name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact head and full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          scan_dir="${RUNNER_TEMP}/modularyn-gitleaks"
          mkdir -p "${scan_dir}"
          cd "${scan_dir}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "${release_url}/${archive}" --output "${archive}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "${release_url}/${checksums}" --output "${checksums}"
          awk -v archive="${archive}" '$2 == archive { print; found++ } END { if (found != 1) exit 1 }' \
            "${checksums}" > selected-checksum.txt
          sha256sum --check --strict selected-checksum.txt
          tar -xzf "${archive}" gitleaks
      - name: Scan the full Git history
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/modularyn-gitleaks/gitleaks" git \
            --log-opts="--all --full-history" --redact --no-banner --exit-code 1 .
