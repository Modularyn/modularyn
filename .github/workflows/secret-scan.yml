name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact head and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          # SHA-256 of the Linux x64 archive of GITLEAKS_VERSION; change the two together.
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "${GITLEAKS_SHA256}" =~ ^[0-9a-f]{64}$ ]] \
            || fail "GITLEAKS_SHA256 must be 64 lowercase hexadecimal characters."
          scan_dir="${RUNNER_TEMP}/modularyn-gitleaks"
          mkdir -p "${scan_dir}"
          cd "${scan_dir}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "${release_url}/${archive}" --output "${archive}"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "${release_url}/${checksums}" --output "${checksums}"
          # The pinned digest does not depend on the release, so it is checked first.
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" > pinned-checksum.txt
          sha256sum --check --strict pinned-checksum.txt \
            || fail "${archive} does not match GITLEAKS_SHA256 ${GITLEAKS_SHA256}. It was not extracted."
          awk -v archive="${archive}" '$2 == archive { print; found++ } END { if (found != 1) exit 1 }' \
            "${checksums}" > selected-checksum.txt \
            || fail "${checksums} must list exactly one checksum for ${archive}."
          release_sha256="$(cut -d ' ' -f 1 selected-checksum.txt)"
          [ "${release_sha256}" = "${GITLEAKS_SHA256}" ] \
            || fail "${checksums} gives ${release_sha256} for ${archive}, which disagrees with GITLEAKS_SHA256 ${GITLEAKS_SHA256}."
          sha256sum --check --strict selected-checksum.txt \
            || fail "${archive} does not match the checksum in ${checksums}."
          tar -xzf "${archive}" gitleaks
      - name: Scan the full Git history
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/modularyn-gitleaks/gitleaks" git \
            --log-opts="--all --full-history" --redact --no-banner --exit-code 1 .
