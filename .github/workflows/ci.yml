name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Each install takes the runner's archive URL and SHA-512 from .github/dotnet-sdk.json and
      # verifies the download before extracting it. No other step installs an SDK or a runtime.
      - name: Install the pinned .NET SDK (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          pin_file=".github/dotnet-sdk.json"
          case "${RUNNER_OS}/${RUNNER_ARCH}" in
            Linux/X64) rid="linux-x64" ;;
            Linux/ARM64) rid="linux-arm64" ;;
            macOS/X64) rid="osx-x64" ;;
            macOS/ARM64) rid="osx-arm64" ;;
            *) fail "No pinned .NET SDK archive for runner ${RUNNER_OS} ${RUNNER_ARCH}." ;;
          esac
          command -v jq > /dev/null || fail "jq is required to read ${pin_file}."
          sdk_version="$(jq -er '.sdk.version' global.json)" || fail "global.json does not name an SDK version."
          pinned_version="$(jq -er '.version' "${pin_file}")" || fail "${pin_file} does not name an SDK version."
          [ "${pinned_version}" = "${sdk_version}" ] \
            || fail "${pin_file} pins SDK ${pinned_version}, but global.json requires ${sdk_version}."
          url="$(jq -er --arg rid "${rid}" '.archives[$rid].url' "${pin_file}")" \
            || fail "${pin_file} has no archive URL for ${rid}."
          sha512="$(jq -er --arg rid "${rid}" '.archives[$rid].sha512' "${pin_file}")" \
            || fail "${pin_file} has no SHA-512 for ${rid}."
          [ "${url}" = "https://builds.dotnet.microsoft.com/dotnet/Sdk/${sdk_version}/dotnet-sdk-${sdk_version}-${rid}.tar.gz" ] \
            || fail "${pin_file} gives ${url} for ${rid}, which is not the official SDK ${sdk_version} archive."
          [[ "${sha512}" =~ ^[0-9a-f]{128}$ ]] || fail "${pin_file} has a malformed SHA-512 for ${rid}."
          echo "Runner ${RUNNER_OS} ${RUNNER_ARCH} selects ${rid}, archive ${url}"
          download_dir="${RUNNER_TEMP}/dotnet-download"
          install_dir="${RUNNER_TEMP}/dotnet"
          rm -rf "${download_dir}" "${install_dir}"
          mkdir -p "${download_dir}" "${install_dir}"
          archive="${download_dir}/dotnet-sdk-${sdk_version}-${rid}.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 "${url}" --output "${archive}" || fail "Download of ${url} failed."
          if command -v sha512sum > /dev/null; then
            actual="$(sha512sum "${archive}" | cut -d ' ' -f 1)" || fail "Cannot compute the SHA-512 of ${archive}."
          else
            actual="$(shasum -a 512 "${archive}" | cut -d ' ' -f 1)" || fail "Cannot compute the SHA-512 of ${archive}."
          fi
          [ "${actual}" = "${sha512}" ] \
            || fail "SHA-512 mismatch for ${url}, expected ${sha512} but got ${actual}. The archive was not extracted."
          echo "SHA-512 verified, ${actual}"
          tar -xzf "${archive}" -C "${install_dir}" || fail "Extraction of ${archive} failed."
          rm -f "${archive}"
          echo "DOTNET_ROOT=${install_dir}" >> "${GITHUB_ENV}"
          echo "${install_dir}" >> "${GITHUB_PATH}"
      - name: Install the pinned .NET SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          function Fail([string] $Message) {
            Write-Output "::error::$Message"
            exit 1
          }
          $pinFile = '.github/dotnet-sdk.json'
          $rid = switch ("$env:RUNNER_OS/$env:RUNNER_ARCH") {
            'Windows/X64' { 'win-x64' }
            'Windows/ARM64' { 'win-arm64' }
            default { '' }
          }
          if ($rid -eq '') {
            Fail "No pinned .NET SDK archive for runner $env:RUNNER_OS $env:RUNNER_ARCH."
          }
          try {
            $sdkVersion = [string] (Get-Content -Raw -LiteralPath 'global.json' | ConvertFrom-Json -AsHashtable)['sdk']['version']
          } catch {
            Fail "global.json does not name an SDK version. $_"
          }
          if ([string]::IsNullOrEmpty($sdkVersion)) {
            Fail 'global.json does not name an SDK version.'
          }
          try {
            $pin = Get-Content -Raw -LiteralPath $pinFile | ConvertFrom-Json -AsHashtable
            $pinnedVersion = [string] $pin['version']
            $url = [string] $pin['archives'][$rid]['url']
            $sha512 = [string] $pin['archives'][$rid]['sha512']
          } catch {
            Fail "$pinFile has no archive URL and SHA-512 for $rid. $_"
          }
          if ($pinnedVersion -cne $sdkVersion) {
            Fail "$pinFile pins SDK $pinnedVersion, but global.json requires $sdkVersion."
          }
          if ($url -cne "https://builds.dotnet.microsoft.com/dotnet/Sdk/$sdkVersion/dotnet-sdk-$sdkVersion-$rid.zip") {
            Fail "$pinFile gives $url for $rid, which is not the official SDK $sdkVersion archive."
          }
          if ($sha512 -cnotmatch '^[0-9a-f]{128}$') {
            Fail "$pinFile has a malformed SHA-512 for $rid."
          }
          Write-Output "Runner $env:RUNNER_OS $env:RUNNER_ARCH selects $rid, archive $url"
          $downloadDir = Join-Path $env:RUNNER_TEMP 'dotnet-download'
          $installDir = Join-Path $env:RUNNER_TEMP 'dotnet'
          foreach ($directory in @($downloadDir, $installDir)) {
            if (Test-Path -LiteralPath $directory) {
              Remove-Item -LiteralPath $directory -Recurse -Force
            }
            New-Item -ItemType Directory -Path $directory | Out-Null
          }
          $archive = Join-Path $downloadDir "dotnet-sdk-$sdkVersion-$rid.zip"
          try {
            Invoke-WebRequest -Uri $url -OutFile $archive -SslProtocol Tls12, Tls13 -MaximumRetryCount 3 -RetryIntervalSec 5
          } catch {
            Fail "Download of $url failed. $_"
          }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actual -cne $sha512) {
            Fail "SHA-512 mismatch for $url, expected $sha512 but got $actual. The archive was not extracted."
          }
          Write-Output "SHA-512 verified, $actual"
          try {
            Expand-Archive -LiteralPath $archive -DestinationPath $installDir
          } catch {
            Fail "Extraction of $archive failed. $_"
          }
          Remove-Item -LiteralPath $archive
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DOTNET_ROOT=$installDir"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $installDir
      - name: Verify the .NET SDK (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          : "${DOTNET_ROOT:?DOTNET_ROOT was not set by the install step.}"
          sdk_version="$(jq -er '.sdk.version' global.json)" || fail "global.json does not name an SDK version."
          resolved="$(command -v dotnet)" || fail "dotnet is not on PATH."
          [ "${resolved}" = "${DOTNET_ROOT}/dotnet" ] \
            || fail "dotnet resolves to ${resolved}, not the pinned install in ${DOTNET_ROOT}."
          reported="$(dotnet --version)" || fail "dotnet --version failed."
          [ "${reported}" = "${sdk_version}" ] \
            || fail "dotnet --version reports ${reported}, but global.json requires ${sdk_version}."
          echo "Using .NET SDK ${reported} from ${DOTNET_ROOT}"
          dotnet --list-sdks
          dotnet --list-runtimes
      - name: Verify the .NET SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          function Fail([string] $Message) {
            Write-Output "::error::$Message"
            exit 1
          }
          if ([string]::IsNullOrEmpty($env:DOTNET_ROOT)) {
            Fail 'DOTNET_ROOT was not set by the install step.'
          }
          try {
            $sdkVersion = [string] (Get-Content -Raw -LiteralPath 'global.json' | ConvertFrom-Json -AsHashtable)['sdk']['version']
          } catch {
            Fail "global.json does not name an SDK version. $_"
          }
          $command = Get-Command -Name 'dotnet' -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $command) {
            Fail 'dotnet is not on PATH.'
          }
          $expected = [System.IO.Path]::GetFullPath((Join-Path $env:DOTNET_ROOT 'dotnet.exe'))
          if ([System.IO.Path]::GetFullPath($command.Source) -ne $expected) {
            Fail "dotnet resolves to $($command.Source), not the pinned install in $env:DOTNET_ROOT."
          }
          $reported = (& dotnet --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            Fail 'dotnet --version failed.'
          }
          if ($reported -cne $sdkVersion) {
            Fail "dotnet --version reports $reported, but global.json requires $sdkVersion."
          }
          Write-Output "Using .NET SDK $reported from $env:DOTNET_ROOT"
          & dotnet --list-sdks
          & dotnet --list-runtimes
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test repository conventions
        run: dotnet test -c Release --no-build
